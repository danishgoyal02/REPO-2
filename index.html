<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 18th drishtuuuu 💙</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #f3e8ff 70%, #bfdbfe 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        h1, h2, h3, .cursive-text {
            font-family: 'Dancing Script', cursive;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        
        @keyframes float-reverse {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .floating { animation: float 5s ease-in-out infinite; }
        .floating-delay { animation: float-reverse 6s ease-in-out infinite; }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .heartbeat { animation: heartbeat 2s infinite; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e0f2fe; }
        ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

        .page-section {
            display: none;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-link.active {
            color: #0369a1;
            border-bottom: 2px solid #0369a1;
            font-weight: 700;
        }
    </style>
</head>
<body class="text-slate-800">

    <div class="fixed top-20 left-10 text-6xl floating opacity-70 z-0 pointer-events-none">🐱</div>
    <div class="fixed top-40 right-16 text-6xl floating-delay opacity-70 z-0 pointer-events-none">🐶</div>
    <div class="fixed bottom-32 left-20 text-5xl floating opacity-70 z-0 pointer-events-none">🐾</div>
    <div class="fixed bottom-20 right-10 text-6xl floating-delay opacity-70 z-0 pointer-events-none">🐈</div>
    <div class="fixed top-1/3 left-3/4 text-6xl floating opacity-60 z-0 pointer-events-none">🐕</div>

    <nav class="fixed top-0 w-full z-50 glass-panel border-b-0">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="text-2xl font-bold cursive-text text-sky-800 flex items-center gap-2">
                    drishtuu <span class="text-pink-400 text-xl">🎀</span>
                </div>
                <ul class="flex gap-6 md:gap-8 text-sm md:text-base font-semibold text-sky-600">
                    <li><a href="#home" class="nav-link active transition-colors hover:text-sky-800 pb-1">Home</a></li>
                    <li><a href="#notes" class="nav-link transition-colors hover:text-sky-800 pb-1">Notes</a></li>
                    <li><a href="#edits" class="nav-link transition-colors hover:text-sky-800 pb-1">Edits</a></li>
                    <li><a href="#memories" class="nav-link transition-colors hover:text-sky-800 pb-1">Memories</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="relative z-10 container mx-auto px-4 pt-28 pb-12 min-h-screen">
        <section id="home" class="page-section active">
            <div class="flex flex-col items-center justify-center min-h-[70vh] text-center">
                <div class="glass-panel p-8 md:p-12 rounded-[3rem] max-w-3xl w-full relative">
                    <div class="absolute -top-6 -right-6 w-20 h-20 bg-pink-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse"></div>
                    <div class="absolute -bottom-6 -left-6 w-24 h-24 bg-sky-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse
